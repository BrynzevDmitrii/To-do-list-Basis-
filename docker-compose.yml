services:
  app:
    build:
      context: .
      target: production
    ports:
      - "8080:80"

  dev:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - nuxt_cache:/app/.nuxt
    environment:
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000

volumes:
  node_modules:
  nuxt_cache:
